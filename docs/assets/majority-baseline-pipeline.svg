<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-labelledby="title desc"><title id="title">Majority class baseline pipeline</title><desc id="desc">Synthetic labels select a majority class, constant prediction is compared to the same labels.</desc><rect width="1100" height="400" rx="24" fill="#111827"/><text x="55" y="58" fill="#fff" font-family="Arial" font-size="29" font-weight="bold">Majority-Class Baseline · id3.py</text><g font-family="Arial" text-anchor="middle"><rect x="55" y="145" width="220" height="115" rx="15" fill="#1d4ed8"/><text x="165" y="193" fill="#fff" font-size="21">Synthetic data</text><text x="165" y="225" fill="#dbeafe" font-size="16">features + labels</text><rect x="405" y="145" width="250" height="115" rx="15" fill="#7c3aed"/><text x="530" y="193" fill="#fff" font-size="21">Select majority</text><text x="530" y="225" fill="#ede9fe" font-size="16">training labels</text><rect x="785" y="145" width="250" height="115" rx="15" fill="#0f766e"/><text x="910" y="193" fill="#fff" font-size="21">Constant output</text><text x="910" y="225" fill="#ccfbf1" font-size="16">same class each row</text></g><g stroke="#cbd5e1" stroke-width="4"><path d="M275 202H405M655 202H785"/></g><g fill="#cbd5e1"><path d="M395 192l12 10-12 10zM775 192l12 10-12 10z"/></g><text x="55" y="315" fill="#fca5a5" font-family="Arial" font-size="18">Current score compares against the same labels used to choose the class.</text><text x="55" y="350" fill="#cbd5e1" font-family="Arial" font-size="17">In-sample baseline, not a held-out performance estimate.</text></svg>