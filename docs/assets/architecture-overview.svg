<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">CEA demos architecture</title><desc id="d">Three independent Streamlit apps execute separate in-process Python calculations.</desc><rect width="1200" height="520" rx="28" fill="#101827"/><text x="60" y="68" fill="#fff" font-family="Arial" font-size="32" font-weight="bold">CEA Learning Demos · Architecture</text><rect x="430" y="100" width="340" height="70" rx="16" fill="#334155"/><text x="600" y="145" fill="#fff" text-anchor="middle" font-family="Arial" font-size="24">Browser</text><g font-family="Arial" text-anchor="middle" font-size="24" fill="#fff"><rect x="60" y="270" width="320" height="130" rx="18" fill="#1d4ed8"/><text x="220" y="325">CEA.py</text><text x="220" y="365" font-size="17">Hypothesis update</text><rect x="440" y="270" width="320" height="130" rx="18" fill="#0f766e"/><text x="600" y="325">bpalgo.py</text><text x="600" y="365" font-size="17">NumPy sigmoid network</text><rect x="820" y="270" width="320" height="130" rx="18" fill="#7c3aed"/><text x="980" y="325">id3.py</text><text x="980" y="365" font-size="17">Majority baseline</text></g><g stroke="#cbd5e1" stroke-width="4" fill="none"><path d="M600 170V220H220V270M600 220V270M600 220H980V270"/></g><text x="60" y="465" fill="#cbd5e1" font-family="Arial" font-size="19">Independent scripts · no shared router · no app database · no model API</text></svg>