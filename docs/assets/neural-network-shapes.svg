<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc"><title id="title">Two input two output neural network shapes</title><desc id="desc">Two inputs connect to a two by two weight matrix, two biases and two sigmoid outputs.</desc><rect width="1100" height="460" rx="24" fill="#101827"/><text x="55" y="60" fill="#fff" font-family="Arial" font-size="30" font-weight="bold">bpalgo.py · Matrix Dimensions</text><g font-family="Arial" text-anchor="middle"><circle cx="170" cy="180" r="38" fill="#1d4ed8"/><circle cx="170" cy="300" r="38" fill="#1d4ed8"/><text x="170" y="188" fill="#fff" font-size="21">x₁</text><text x="170" y="308" fill="#fff" font-size="21">x₂</text><rect x="375" y="140" width="240" height="190" rx="18" fill="#334155"/><text x="495" y="178" fill="#fff" font-size="23">W (2 × 2)</text><text x="495" y="222" fill="#cbd5e1" font-size="18">W x + b</text><text x="495" y="257" fill="#cbd5e1" font-size="18">b (2 × 1)</text><text x="495" y="298" fill="#cbd5e1" font-size="16">sigmoid</text><circle cx="850" cy="180" r="42" fill="#0f766e"/><circle cx="850" cy="300" r="42" fill="#0f766e"/><text x="850" y="188" fill="#fff" font-size="21">y₁</text><text x="850" y="308" fill="#fff" font-size="21">y₂</text></g><g stroke="#94a3b8" stroke-width="3"><path d="M208 180L375 190M208 180L375 270M208 300L375 190M208 300L375 270M615 190L808 180M615 270L808 300"/></g><text x="55" y="410" fill="#fca5a5" font-family="Arial" font-size="17">Shape reference only. Streamlit reruns recreate network unless state is retained.</text></svg>